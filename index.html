<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Island 空島</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container"></div>
  <div id="crosshair"></div>
  <div id="damage-flash"></div>
  <div id="health-display" class="health-display">HP 20/20</div>
  <div id="hotbar" class="hotbar"></div>
  <div id="death-overlay">
    <div class="death-box">
      <h1>你死了</h1>
      <p>點一下重生</p>
    </div>
  </div>
  <div id="prompt-overlay">
    <div class="prompt-box">
      <h1>Sky Island 空島</h1>
      <p>點擊畫面鎖定滑鼠開始遊玩</p>
      <p class="controls-hint">WASD：前後左右移動 ｜ Space：跳躍 ｜ 滑鼠：旋轉視角 ｜ Esc：解除鎖定</p>
    </div>
  </div>
  <script src="dist/bundle.js"></script>
</body>
</html>
